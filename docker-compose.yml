version: '3.8'

services:
  # Relational Database for Users, Interviews, RBAC, Configurations
  postgres:
    image: postgres:15-alpine
    container_name: nm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nm_interview_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Document Database for Resumes, Transcripts, Behavioral Analytics JSON
  mongodb:
    image: mongo:6-jammy
    container_name: nm_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Cache & Message Broker for Real-time Socket Events, Leaderboards, BullMQ
  redis:
    image: redis:7-alpine
    container_name: nm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  redis_data:
